name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: SummerCalExpo
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install Pods
        working-directory: SummerCalExpo/ios
        run: |
          pod repo update 2>&1 | tail -5 || true
          pod install --verbose 2>&1 | tail -50
          echo "--- Checking workspace ---"
          ls -la *.xcworkspace 2>/dev/null || echo "No workspace"
          ls -la *.xcodeproj 2>/dev/null || echo "No project"

      - name: Find scheme
        run: |
          if [ -d "ios/SummerCalExpo.xcworkspace" ] || ls ios/*.xcworkspace 2>/dev/null; then
            WORKSPACE=$(ls ios/*.xcworkspace -d 2>/dev/null | head -1)
            echo "Workspace found: $WORKSPACE"
            echo "Schemes in workspace:"
            xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null || echo "Could not list"
            echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          elif [ -d "ios/SummerCalExpo.xcodeproj" ] || ls ios/*.xcodeproj 2>/dev/null; then
            PROJECT=$(ls ios/*.xcodeproj -d 2>/dev/null | head -1)
            echo "Project found: $PROJECT"
            echo "Schemes in project:"
            xcodebuild -project "$PROJECT" -list 2>/dev/null || echo "Could not list"
            echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          else
            echo "Neither workspace nor project found!"
            ls -la ios/
            exit 1
          fi

      - name: Build unsigned IPA
        run: |
          if [ -n "${WORKSPACE:-}" ]; then
            # Get the first scheme from the workspace
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | sed -n '/Schemes:/,/^$/p' | grep -v Schemes | grep -v '^$' | head -1 | tr -d ' ')
            echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=No \
              CODE_SIGNING_REQUIRED=No \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO
          elif [ -n "${PROJECT:-}" ]; then
            SCHEME=$(xcodebuild -project "$PROJECT" -list 2>/dev/null | sed -n '/Schemes:/,/^$/p' | grep -v Schemes | grep -v '^$' | head -1 | tr -d ' ')
            echo "Building project: $PROJECT with scheme: $SCHEME"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=No \
              CODE_SIGNING_REQUIRED=No \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO
          fi

      - name: Package IPA
        run: |
          echo "Finding .app..."
          find . -name "*.app" -type d 2>/dev/null | head -10
          APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            find / -maxdepth 5 -name "*.app" -type d 2>/dev/null | head -10
            echo "No .app found"
            exit 1
          fi
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ../SummerCal.ipa Payload
          rm -rf Payload
          ls -la ../SummerCal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-IPA
          path: SummerCalExpo/SummerCal.ipa
          retention-days: 7
