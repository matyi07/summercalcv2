name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: SummerCalExpo
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: SummerCalExpo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install || true

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild \
            -workspace SummerCalExpo.xcworkspace \
            -scheme SummerCalExpo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=No \
            CODE_SIGNING_REQUIRED=No \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find ../build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ../build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/$APP_NAME"
          zip -r ../SummerCal.ipa Payload
          rm -rf Payload
          ls -la ../SummerCal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-IPA
          path: SummerCalExpo/SummerCal.ipa
          retention-days: 7
