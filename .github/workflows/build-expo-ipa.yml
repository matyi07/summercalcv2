name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: SummerCalExpo
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Debug - list ios directory
        run: |
          echo "=== ios directory ==="
          ls -la ios/
          echo "=== Podfile ==="
          cat ios/Podfile 2>/dev/null | head -30 || echo "No Podfile"

      - name: Install Ruby deps
        run: |
          gem install cocoapods --no-document
          gem install bundler --no-document

      - name: Install Pods
        working-directory: SummerCalExpo/ios
        run: |
          pod install --repo-update 2>&1 || pod install 2>&1 || echo "Pod install had issues, checking workspace..."
          ls -la *.xcworkspace 2>/dev/null || echo "No workspace found"

      - name: Debug - list after pods
        run: |
          echo "=== ios after pods ==="
          ls -la ios/
          ls -la ios/*.xcworkspace 2>/dev/null || echo "No xcworkspace"
          ls -la ios/*.xcodeproj 2>/dev/null || echo "No xcodeproj"

      - name: Build unsigned IPA
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -type d 2>/dev/null | head -1)
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=No \
              CODE_SIGNING_REQUIRED=No \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO
          else
            PROJECT=$(find ios -name "*.xcodeproj" -type d 2>/dev/null | head -1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            echo "No workspace, building project: $PROJECT"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=No \
              CODE_SIGNING_REQUIRED=No \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              ONLY_ACTIVE_ARCH=NO
          fi

      - name: Package IPA
        run: |
          echo "=== Finding .app ==="
          find build -name "*.app" -type d 2>/dev/null
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, searching everywhere..."
            find / -name "*.app" -type d 2>/dev/null | head -5
            exit 1
          fi
          echo "App found: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/$APP_NAME"
          zip -r ../SummerCal.ipa Payload
          rm -rf Payload
          ls -la ../SummerCal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-IPA
          path: SummerCalExpo/SummerCal.ipa
          retention-days: 7
