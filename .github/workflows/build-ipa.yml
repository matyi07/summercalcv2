name: Build SummerCal IPA (Swift)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd SummerCal && xcodegen generate
      - name: Build unsigned
        run: |
          cd SummerCal
          xcodebuild archive \
            -project SummerCal.xcodeproj \
            -scheme SummerCal \
            -configuration Release \
            -archivePath ../build/SummerCal.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=No \
            CODE_SIGNING_REQUIRED=No \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SummerCal.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>development</string><key>compileBitcode</key><false/></dict></plist>') || true
          ls -la build/ipa/ 2>/dev/null || echo "Export failed, packaging manually"
          mkdir -p Payload
          cp -R build/SummerCal.xcarchive/Products/Applications/SummerCal.app Payload/ 2>/dev/null || true
          zip -r SummerCal.ipa Payload 2>/dev/null || echo "Manual packaging attempt done"
          ls -la SummerCal.ipa 2>/dev/null || echo "No IPA produced"
      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-Swift-IPA
          path: "*.ipa"
          retention-days: 7
