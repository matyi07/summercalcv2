name: Build IPA (Swift)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: |
          cd $GITHUB_WORKSPACE/SummerCal
          xcodegen generate
          echo "=== Generated files ==="
          ls -la
          echo "=== Available schemes ==="
          xcodebuild -project SummerCal.xcodeproj -list
      
      - name: Build unsigned IPA
        run: |
          cd $GITHUB_WORKSPACE/SummerCal
          xcodebuild archive \
            -project SummerCal.xcodeproj \
            -scheme SummerCal \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/SummerCal.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=No \
            CODE_SIGNING_REQUIRED=No \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Package IPA
        run: |
          echo "=== Looking for .app ==="
          find $GITHUB_WORKSPACE/build -name "*.app" -type d
          APP_PATH=$(find $GITHUB_WORKSPACE/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r $GITHUB_WORKSPACE/SummerCal.ipa Payload
          rm -rf Payload
          ls -la $GITHUB_WORKSPACE/SummerCal.ipa
      
      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-IPA
          path: SummerCal.ipa
          retention-days: 7
