name: Build IPA (Swift)

on:
  push:
    paths:
      - 'SummerCal/**'
      - '.github/workflows/build-swift-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        working-directory: SummerCal
        run: xcodegen generate
      
      - name: Show project info
        working-directory: SummerCal
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== Xcode project ==="
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj"
          echo "=== Schemes ==="
          xcodebuild -project *.xcodeproj -list 2>/dev/null || true
      
      - name: Build unsigned archive
        working-directory: SummerCal
        run: |
          xcodebuild archive \
            -project SummerCal.xcodeproj \
            -scheme SummerCal \
            -configuration Release \
            -archivePath ../build/SummerCal.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=No \
            CODE_SIGNING_REQUIRED=No \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Package as IPA
        run: |
          echo "=== Archive contents ==="
          ls -la build/SummerCal.xcarchive/Products/Applications/ 2>/dev/null || echo "No Products dir"
          find build -name "*.app" -type d 2>/dev/null
          
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "App: $APP_PATH"
          
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r SummerCal.ipa Payload
            rm -rf Payload
            ls -la SummerCal.ipa
          else
            echo "No .app found!"
            exit 1
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: SummerCal-IPA
          path: SummerCal.ipa
          retention-days: 7
