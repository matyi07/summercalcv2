name: SummerCal
options:
  bundleIdPrefix: com.summercal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: SummerCal/Info.plist

targets:
  SummerCal:
    type: application
    platform: iOS
    sources:
      - path: SummerCal
        excludes:
          - "Package.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summercal.v2
        INFOPLIST_FILE: SummerCal/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SummerCal/Info.plist
      properties:
        CFBundleDisplayName: SummerCal
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        NSLocationWhenInUseUsageDescription: "SummerCal uses your location to show local weather and nearby places. You can disable this anytime."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SummerCal uses your location for weather alerts and place suggestions."
    entitlements:
      path: SummerCal/SummerCal.entitlements
      properties:
        com.apple.developer.weatherkit: true
